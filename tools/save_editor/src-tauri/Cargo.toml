[package]
name = "moon-save-editor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Jonhline <126247972+Jonhline@users.noreply.github.com>"]
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
crc32fast = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
